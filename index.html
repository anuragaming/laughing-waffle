<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Trung Gian (Chống phát hiện thoát trang)</title>
    <style>
        body { 
            background: #09090f; 
            color: #d8b4fe; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding-top: 20vh; 
        }
        .loading { font-size: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="loading">⏳ Đang kết nối tải trang gốc và chèn mã ẩn danh...</div>

    <script>
        const targetUrl = 'https://potential-funicular-opal.vercel.app/';
        
        // Đổi sang dùng proxy của AllOrigins (chạy ổn định hơn rất nhiều)
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const injectedScript = `
            <script>
                Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
                Object.defineProperty(document, 'hidden', { get: () => false });
                const originalAdd = document.addEventListener;
                document.addEventListener = function(type, listener, options) {
                    if (type === 'visibilitychange') return; // Chặn theo dõi
                    return originalAdd.call(this, type, listener, options);
                };
            <\/script>
        `;

        fetch(proxyUrl)
            .then(response => {
                if (!response.ok) throw new Error('Không thể tải trang gốc');
                return response.json(); // AllOrigins trả dữ liệu về dưới dạng JSON
            })
            .then(data => {
                // Lấy mã HTML gốc từ thuộc tính contents của JSON
                const html = data.contents; 
                
                // Tiêm mã đánh lừa vào HTML
                const modifiedHtml = html.replace('<head>', '<head>' + injectedScript);

                // Vẽ lại toàn bộ trang
                document.open();
                document.write(modifiedHtml);
                document.close();
            })
            .catch(error => {
                document.body.innerHTML = `<h3>❌ Lỗi kết nối: Proxy hiện tại đang chặn hoặc quá tải.</h3>`;
                console.error(error);
            });
    </script>
</body>
</html>
